<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>LabelScope – Camera (Hi-Res)</title>
  <style>
    body{margin:0;padding:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#111;color:#eee}
    header{margin-bottom:8px;font-weight:600}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .col{flex:1 1 320px;min-width:320px}
    video,canvas,img{width:100%;background:#000;border-radius:8px}
    button{padding:10px 14px;border:0;border-radius:8px;background:#2d6cdf;color:#fff;font-weight:600;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .toolbar{display:flex;gap:8px;margin:10px 0 16px}
    .hint{font-size:.9rem;color:#bbb}
    .ok{color:#6ee7b7}
    .err{color:#fca5a5;white-space:pre-wrap}
  </style>
</head>
<body>
  <header>カメラ（高解像度）</header>

  <div class="row">
    <div class="col">
      <video id="v" playsinline autoplay muted></video>
      <div class="toolbar">
        <button id="startBtn">カメラ開始</button>
        <button id="shotBtn" disabled>撮影</button>
        <button id="dlBtn" disabled>保存（JPG）</button>
      </div>
      <div class="hint" id="camInfo"></div>
      <div class="hint">※ 背面カメラ／高解像度を要求。対応不可の端末は可能な最大解像度で動作。</div>
      <div class="err" id="err"></div>
    </div>
    <div class="col">
      <canvas id="c" style="display:none;"></canvas>
      <img id="preview" alt="プレビュー" />
      <div class="hint" id="imgInfo"></div>
    </div>
  </div>

  <script>
  (function(){
    const v = document.getElementById('v');
    const c = document.getElementById('c');
    const preview = document.getElementById('preview');
    const startBtn = document.getElementById('startBtn');
    const shotBtn = document.getElementById('shotBtn');
    const dlBtn = document.getElementById('dlBtn');
    const camInfo = document.getElementById('camInfo');
    const imgInfo = document.getElementById('imgInfo');
    const errBox = document.getElementById('err');

    let stream = null;
    let lastBlob = null;

    async function startCamera(){
      errBox.textContent = '';
      // 高解像度要求（端末上限に近い値）。必要なら数値を上げてもよい。
      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width:  { ideal: 3264 },   // 3264x2448 ≒ 8MP級（端末により変動）
          height: { ideal: 2448 },
          frameRate: { ideal: 30 }
        }
      };
      try{
        if(stream){
          stream.getTracks().forEach(t=>t.stop());
          stream = null;
        }
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        v.srcObject = stream;
        await v.play();
        const track = stream.getVideoTracks()[0];
        const s = track.getSettings ? track.getSettings() : {};
        camInfo.textContent = `カメラ: ${s.width||v.videoWidth}x${s.height||v.videoHeight} / facing=${s.facingMode||'n/a'} / fps=${s.frameRate||'n/a'}`;
        startBtn.disabled = true;
        shotBtn.disabled = false;
      }catch(e){
        errBox.textContent = String(e);
      }
    }

    async function takePhoto(){
      errBox.textContent = '';
      const track = stream && stream.getVideoTracks ? stream.getVideoTracks()[0] : null;
      // ImageCapture が使える場合はフル解像度撮影を試みる
      if (track && 'ImageCapture' in window) {
        try{
          const ic = new ImageCapture(track);
          const blob = await ic.takePhoto({ imageWidth: 0, imageHeight: 0 }); // 0指定で最大解像度を選ぶ実装が多い
          await showBlob(blob);
          return;
        }catch(e){
          // フォールバックへ（iOS/Safari などで未対応時）
        }
      }
      // フォールバック：ビデオフレームの実解像度でキャンバスに描画
      const w = v.videoWidth;
      const h = v.videoHeight;
      if(!w || !h){
        errBox.textContent = 'カメラ未初期化。数秒待ってから再試行してください。';
        return;
      }
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d', { alpha:false, desynchronized:true });
      ctx.drawImage(v, 0, 0, w, h);
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.95));
      await showBlob(blob);
    }

    async function showBlob(blob){
      if(!blob){ errBox.textContent = '撮影に失敗しました。'; return; }
      lastBlob = blob;
      const url = URL.createObjectURL(blob);
      preview.src = url;
      const kb = (blob.size/1024).toFixed(1);
      const img = await blobToBitmap(blob);
      imgInfo.textContent = `画像: ${img.width}x${img.height} / ${kb} KB`;
      dlBtn.disabled = false;
    }

    function blobToBitmap(blob){
      return new Promise((resolve,reject)=>{
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(blob);
      });
    }

    function download(){
      if(!lastBlob) return;
      const ts = Date.now();
      const a = document.createElement('a');
      a.download = `cam_${ts}.jpg`; // 既存フローの命名と合わせる
      a.href = URL.createObjectURL(lastBlob);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    startBtn.addEventListener('click', startCamera);
    shotBtn.addEventListener('click', takePhoto);
    dlBtn.addEventListener('click', download);

    // 端末で自動開始したい場合は以下を有効化（ユーザー操作不要な環境のみ）
    // startCamera();
  })();
  </script>
</body>
</html>
