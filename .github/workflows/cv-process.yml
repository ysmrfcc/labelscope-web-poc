name: CV Process

on:
  push:
    branches: [ main ]
    paths:
      - 'images/**'  # images 配下の更新で毎回起動

jobs:
  run-cv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # ジョブ全体に Secrets を注入（全ステップ参照可）
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      AZURE_CV_ENDPOINT: ${{ secrets.AZURE_CV_ENDPOINT }}
      AZURE_CV_KEY: ${{ secrets.AZURE_CV_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -e
          if [ -z "${AZURE_CV_ENDPOINT}" ] || [ -z "${AZURE_CV_KEY}" ]; then
            echo "Secrets missing: AZURE_CV_ENDPOINT or AZURE_CV_KEY"
            exit 1
          fi
          echo "Secrets present: OK"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build results (per-image JSON + index.json)
        run: |
          python scripts/build_results.py

      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "results: update docs/data (json + index.json) [skip ci]" || echo "no changes"
          git push
