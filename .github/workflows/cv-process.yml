name: CV Prediction

on:
  push:
    branches: [ main ]
    paths:
      - 'images/**'

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      PREDICTION_ENDPOINT: ${{ secrets.PREDICTION_ENDPOINT }}
      PREDICTION_KEY: ${{ secrets.PREDICTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          test -n "${PREDICTION_ENDPOINT}" || (echo "PREDICTION_ENDPOINT missing" && exit 1)
          test -n "${PREDICTION_KEY}" || (echo "PREDICTION_KEY missing" && exit 1)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build results (per-image JSON + index.json)
        run: python scripts/build_results.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "results: update docs/data (prediction json + index.json) [skip ci]" || echo "no changes"
          git push
