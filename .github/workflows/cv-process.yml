name: CV Prediction

on:
  push:
    branches: [ main ]
    paths:
      - 'images/**'
      - 'scripts/build_results.py'
      - '.github/workflows/cv-process.yml'

jobs:
  run-prediction:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      # 既存の Secrets 名をそのまま使う（中身は Prediction 用の detect URL と Prediction-Key）
      azure_cv_endpoint: ${{ secrets.azure_cv_endpoint }}
      azure_cv_key: ${{ secrets.azure_cv_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -e
          if [ -z "${azure_cv_endpoint}" ]; then echo "azure_cv_endpoint missing"; exit 1; fi
          if [ -z "${azure_cv_key}" ]; then echo "azure_cv_key missing"; exit 1; fi
          echo "Secrets OK"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build results (per-image JSON + index.json)
        run: python scripts/build_results.py

      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "results: update docs/data (prediction json + index.json) [skip ci]" || echo "no changes"
          git push
